name: Provision Student Exam Repository

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  provision:
    name: Create Private Exam Repo for Student
    runs-on: ubuntu-latest
    # Only run inside the main template repository
    if: github.repository == 'metu-ieee/cs-python-exemption-exam-26-27'

    steps:
      - name: Provision Private Repo & Invite Student
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          VAULT_TOKEN: ${{ secrets.CLASSROOM_TEST_TOKEN }}
          STUDENT: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEMPLATE_REPO: ${{ github.repository }}
        run: |
          TARGET_REPO="metu-ieee/cs-python-exemption-exam-26-27-${STUDENT}"
          echo "Checking if $TARGET_REPO already exists..."

          # 1. Prevent duplicate exam creation (protects the 3-push limit)
          if gh repo view "$TARGET_REPO" >/dev/null 2>&1; then
            gh issue comment "$ISSUE_NUMBER" --repo "$TEMPLATE_REPO" --body "⚠️ Hi @${STUDENT}, your private exam repository has **already been generated**:
          👉 **https://github.com/${TARGET_REPO}**

          *(If you haven't accepted your collaborator invite yet, visit https://github.com/${TARGET_REPO}/invitations).*
          You cannot generate a second repository to reset your 3-push limit."
            gh issue close "$ISSUE_NUMBER" --repo "$TEMPLATE_REPO"
            exit 0
          fi

          # 2. Create private student repository from template
          echo "Creating private repository $TARGET_REPO..."
          gh repo create "$TARGET_REPO" --private --template "$TEMPLATE_REPO"

          # Wait briefly for GitHub backend initialization
          sleep 4

          # 3. Inject CLASSROOM_TEST_TOKEN into the student's new private repository
          echo "Injecting autograder secret into $TARGET_REPO..."
          gh secret set CLASSROOM_TEST_TOKEN --repo "$TARGET_REPO" --body "$VAULT_TOKEN"

          # 4. Invite student with Write (push) permissions
          echo "Inviting @$STUDENT as collaborator..."
          gh api -X PUT "/repos/${TARGET_REPO}/collaborators/${STUDENT}" -f permission=push >/dev/null 2>&1 || true

          # 5. Reply to the Issue with instructions and close it
          gh issue comment "$ISSUE_NUMBER" --repo "$TEMPLATE_REPO" --body "✅ **Exam Repository Provisioned for @${STUDENT}!**

          ### 🚀 Next Steps:
          1. **Accept Your Invite:** Click here first 👉 **https://github.com/${TARGET_REPO}/invitations** (or check your email) to accept access.
          2. **Open Your Private Repo:** Go to **https://github.com/${TARGET_REPO}**.
          3. **Launch Codespaces:** Click the green **\`<> Code\`** button $\to$ **Codespaces** tab $\to$ **Create codespace on main**.
          4. **Test Locally:** Run \`python exam/local_tests.py\` in the terminal as many times as you want.
          5. **3-Push Cap:** You have a maximum of **3 pushes** to \`main\`. Your highest score across those 3 pushes is your official grade!"

          gh issue close "$ISSUE_NUMBER" --repo "$TEMPLATE_REPO"
